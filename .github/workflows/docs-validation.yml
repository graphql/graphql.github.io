name: Docs validation

on: pull_request

jobs:
  prettier-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: the-guild-org/shared-config/setup@main
        name: setup env
        with:
          packageManager: pnpm
          workingDirectory: ./

      - name: Install Dependencies
        run: pnpm i

      - name: Run Prettier Check
        run: pnpm format:check

  link-check:
    name: Broken link checker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: the-guild-org/shared-config/setup@main
        name: setup env
        with:
          packageManager: pnpm
          workingDirectory: ./

      - name: Install Dependencies
        run: pnpm i

      - name: Build static site
        run: pnpm build

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable

      - name: Install lychee
        run: cargo install lychee

      - name: Check links
        run: lychee --verbose --no-progress './out/**/*.html'

  lint:
    name: Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: the-guild-org/shared-config/setup@main
        name: setup env
        with:
          packageManager: pnpm
          workingDirectory: ./

      - name: Install Dependencies
        run: pnpm i

      - name: Run linting
        run: pnpm lint:docs

  code-validate:
    name: Snippet validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: the-guild-org/shared-config/setup@main
        name: setup env
        with:
          packageManager: pnpm
          workingDirectory: ./

      - name: Install Dependencies
        run: pnpm i

      - name: Validate code snippets
        run: pnpm validate:snippets
